spring:
  application:
    name: intelligent-resume-server
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  # 优雅停机：SIGTERM 后先停止接收新请求，等待在途 HTTP 请求完成（上限见下），再关闭其它组件。
  # 刻意不等待 worker：AI/PDF worker 线程均为守护线程、租约语义接管在途任务（见 app.ai.worker /
  # app.pdf.worker 注释），故本设置只影响 Web 请求，不会拖长发布停机时间。
  # 容器部署须让宽限期大于该上限（deploy/docker-compose.prod.yml 的 api.stop_grace_period=25s，
  # 否则 docker 会在优雅停机中途 SIGKILL）；systemd 默认 TimeoutStopSec=90s 足够。
  # 契约由 ShutdownContractTest 静态门禁守护。
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  mvc:
    problemdetails:
      enabled: false
  servlet:
    multipart:
      # 与 ResumeImportService 业务上限（5MB）统一；6MB 预留请求头等余量
      max-file-size: 5MB
      max-request-size: 6MB
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

  # T01 数据库与迁移
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/intelligent_resume?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:resume_app}
    password: ${SPRING_DATASOURCE_PASSWORD:resume_app_dev}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:com.mysql.cj.jdbc.Driver}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: Asia/Shanghai
        format_sql: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  # 优雅停机：停止接收新连接并等待在途请求（上限 spring.lifecycle.timeout-per-shutdown-phase）。
  # 缺省（immediate）会在收到 SIGTERM 时立即断开在途请求——发布/重启期间前端会看到连接被重置。
  shutdown: graceful
  tomcat:
    # 请求体超限（multipart max-request-size 6MB / max-file-size 5MB）时，Tomcat 需要把
    # 客户端尚未发完的剩余字节读掉（swallow）才能把 413 响应送达；默认上限 2MB 时，
    # CI（Linux + 慢客户端）实测客户端在写完前拿到连接重置（HTTP 0）而不是 413。
    # 8MB 覆盖「6MB 请求上限 + 余量」：被拒请求的剩余字节都能被丢弃，413 稳定送达。
    # 远大于该值的流式请求仍会被连接级中断（无界 swallow 会让任意大请求占带宽），
    # 生产由 nginx 的 client_max_body_size 6m（= 上方 max-request-size）先行拒绝。
    max-swallow-size: 8MB

management:
  defaults:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

  # 简历导入(上传解析)——单文件大小上限,与 spring.servlet.multipart.max-file-size(5MB)保持一致
  resume-import:
    max-bytes: ${RESUME_IMPORT_MAX_BYTES:5242880}
    # #17：解析资源边界——页数/文本长度/单次解析耗时上限（入口 5MB 之外的第二道闸）
    max-pdf-pages: ${RESUME_IMPORT_MAX_PDF_PAGES:60}
    max-text-characters: ${RESUME_IMPORT_MAX_TEXT_CHARACTERS:200000}
    extract-timeout-ms: ${RESUME_IMPORT_EXTRACT_TIMEOUT_MS:15000}

  # T03 简历 JSON 校验
  resume:
    json-schema:
      max-bytes: ${RESUME_JSON_MAX_BYTES:262144}
      require-top-level: basics
      allow-sections: basics,work,education,skills,projects,certificates,languages,awards,objective,links,volunteering,courses,publications,customSections,template,layout

  # T04 职业资料
  career-material:
    content-json:
      max-bytes: ${CAREER_MATERIAL_JSON_MAX_BYTES:65536}

  # T05 JD 管理
  job:
    jd-text:
      max-length: ${JD_TEXT_MAX_LENGTH:5000}
      min-length: ${JD_TEXT_MIN_LENGTH:20}
    parser:
      rule-version: "v1.0.0"
      keyword-dictionary:
        - "Java"
        - "Spring Boot"
        - "Spring Cloud"
        - "MySQL"
        - "PostgreSQL"
        - "Redis"
        - "Kafka"
        - "Docker"
        - "Kubernetes"
        - "微服务"
        - "分布式"
        - "高并发"
        - "JVM"
        - "多线程"
      education-keywords:
        - "本科"
        - "硕士"
        - "博士"
        - "Bachelor"
        - "Master"
        - "PhD"
      experience-pattern: "(\\d+)\\s*年(以上)?(?:经验|工作)"

  # T02 JWT
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-32bytes-min-length-required}
    issuer: ${JWT_ISSUER:intelligent-resume-builder}
    access-token-ttl-seconds: ${JWT_ACCESS_TTL:3600}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TTL:2592000}
    # 每请求用户状态校验的短 TTL 缓存（PA-2）：抵消 #6 安全闭环的每请求查库。
    # 代价：直改库等非删号路径的状态变更最迟 TTL 后生效；删号路径提交后即时清除。
    active-user-cache-ttl-seconds: ${JWT_ACTIVE_USER_CACHE_TTL:30}
    refresh-cookie:
      name: ${REFRESH_COOKIE_NAME:irt_refresh}
      max-age: ${JWT_REFRESH_TTL:2592000}
      secure: ${COOKIE_SECURE:false}

  # T02 限流
  security:
    rate-limit:
      login-per-minute: ${RATE_LIMIT_LOGIN:10}
      register-per-minute: ${RATE_LIMIT_REGISTER:5}
      refresh-per-minute: ${RATE_LIMIT_REFRESH:30}
      # CPU 放大器端点：简历解析（PDFBox/POI 全内存解析 5MB 文件）阈值从严
      resume-import-parse-per-minute: ${RATE_LIMIT_RESUME_IMPORT_PARSE:6}
      # JD 解析（本地轻量文本解析）阈值宽松
      jd-parse-per-minute: ${RATE_LIMIT_JD_PARSE:15}
      # 凭证变更（/api/auth/me/password、/api/auth/me/email）：两者均校验「当前密码」，
      # 属口令验证面；共享同一分桶，防止在两端点间交替获得双倍预算
      change-credential-per-minute: ${RATE_LIMIT_CREDENTIAL:5}
      # 客户端 IP 解析（限流分桶 + 会话审计）：仅在可信反代之后开启。
      # 开启时取 X-Forwarded-For 最左值，要求最外层代理**覆写**该头
      # （deploy/nginx/edge.conf、host.conf 均用 $remote_addr 覆写，内层 web 继续追加）。
      # prod profile 由 ProductionConfigurationValidator 强制要求 true；直连部署（默认 profile）也应显式开启，
      # 否则所有客户端共用代理地址这一个分桶（登录 10/min 等阈值退化为全站共享）。
      trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
      max-buckets: ${RATE_LIMIT_MAX_BUCKETS:10000}

  # T06 AI 同意与任务
  ai:
    # #44：通用 /api/ai/tasks 的 input 语义大小上限（序列化后字节数）。
    # 与简历 JSON 校验上限一致（262144），足够承载内联简历/JD，同时挡住超大 JSON 写入任务快照与提示词。
    max-input-json-bytes: ${AI_MAX_INPUT_JSON_BYTES:262144}
    # #36：资料文本的 prompt 字节预算（资料选择与岗位定制生成两条链路共用）。
    # 此前只有条数限制：sourceText 无准入长度上限、contentJson 单条上限 64KB，
    # 最坏情况下提示词可达数 MB，浪费配额且可能直接超出模型上下文。
    # 单条额度 = min(max-material-bytes, max-materials-total-bytes / 条数)，
    # 因此 n 条资料的原始文本总量不超过总量上限；超限按 UTF-8 字符边界截断并追加
    # [truncated] 标记（不丢弃资料，materialId 始终保留在提示词中）。
    prompt:
      max-material-bytes: ${AI_PROMPT_MAX_MATERIAL_BYTES:65536}
      max-materials-total-bytes: ${AI_PROMPT_MAX_MATERIALS_TOTAL_BYTES:262144}
    bailian:
      base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
      api-key: ${BAILIAN_API_KEY:}
      # 单模型候选；当 model-chain 为空时退化为单模型行为（向后兼容）。
      model: ${BAILIAN_MODEL:qwen-plus}
      # 模型链：有序、逗号分隔。按序尝试，失败顺延；额度耗尽/模型下线的条目进入冷却期被跳过。
      # 百炼免费额度按模型计量，单模型耗尽会导致全部 AI 功能一起失效，故默认用链。
      # ⚠ 不要复用历史已废弃的 BAILIAN_MODELS —— 部分 .env 中仍残留该僵尸变量，复用会被静默激活。
      model-chain: ${BAILIAN_MODEL_CHAIN:}
      # 额度类失效（额度耗尽、模型下线）的冷却时长；额度不会短期恢复，故取较长值
      chain-quota-cooldown-seconds: ${AI_CHAIN_QUOTA_COOLDOWN_S:1800}
      # 瞬时故障（超时、连接失败、5xx、限流、空响应）的冷却时长
      chain-transient-cooldown-seconds: ${AI_CHAIN_TRANSIENT_COOLDOWN_S:60}
      # 整条链的总时间预算。单个模型的读超时（默认 300s）乘以链长度会放大成数十分钟，
      # 而 worker 处理单条任务期间会一直占住线程，导致后续 AI 任务排队阻塞。
      # 超出预算即停止顺延并快速失败，交 worker 重试机制稍后再跑。
      chain-total-budget-seconds: ${AI_CHAIN_TOTAL_BUDGET_S:600}
      # 对哪些任务类型关闭模型推理（逗号分隔）。
      # 链上的模型是推理型模型，会把绝大部分输出预算花在【不可见的 reasoning token】上：
      # 实测 JOB_GENERATION 的 completion_tokens=8575 中 reasoning_tokens=7539（88%），
      # 单次耗时 477s（含链首 300s 超时）；关闭推理后 11~12s 完成，且 11 个章节齐全、
      # 溯源契约校验通过 —— 提速约 40 倍。
      # ⚠ 该参数并非所有模型都接受：实测 glm-5.3 / qwen3.8-2.4t-a95b / kimi-k3 会返回 400，
      #   由「400 顺延」机制跳过它们（见 BailianFailureClassifier#dispositionFor）。
      disable-thinking-task-types: ${AI_DISABLE_THINKING_TASK_TYPES:JOB_GENERATION}
      connect-timeout-seconds: ${BAILIAN_CONNECT_TIMEOUT_S:10}
      read-timeout-seconds: ${BAILIAN_READ_TIMEOUT_S:300}
    worker:
      poll-interval-ms: ${AI_WORKER_POLL_MS:1000}
      # 租约须大于单任务最坏执行时长（provider 链总预算 600s + 余量）：否则心跳失联时
      # 旧 worker 仍可能在调用 provider，而第二 worker 已接管重跑，造成重复外部调用/计费。
      # 代价：进程崩溃后的任务恢复需等租约到期（可接受——崩溃场景旧进程已死，无重复调用）。
      lease-seconds: ${AI_WORKER_LEASE_S:660}
      max-retries: ${AI_WORKER_MAX_RETRIES:3}
      batch-size: ${AI_WORKER_BATCH:5}
      # 分组并发额度:重任务(分钟级)与轻任务(秒级)各自独立,防止长任务饿死短任务
      heavy-concurrency: ${AI_WORKER_HEAVY_CONCURRENCY:2}
      light-concurrency: ${AI_WORKER_LIGHT_CONCURRENCY:2}
    # #26：AI 任务留存清理。终态任务超期后压缩内联快照（input_snapshot_json）与结果
    # （result_json）为元数据；待确认与进行中的任务不压缩；用户侧另有
    # DELETE /api/ai/tasks/history 可立即清空自己的任务历史。
    task:
      retention-days: ${AI_TASK_RETENTION_DAYS:90}
      cleanup-interval-ms: ${AI_TASK_CLEANUP_INTERVAL_MS:86400000}
      cleanup-batch-size: ${AI_TASK_CLEANUP_BATCH_SIZE:200}
    consent:
      policy-version: "v1.2.0"
    quota:
      JOB_MATERIAL_SELECTION: 30
      JOB_GENERATION: 30
      RESUME_OPTIMIZE: 30
      INLINE_OPTIMIZE: 60
      MATERIAL_IMPORT: 5
      ACHIEVEMENT_GUIDANCE: 10
      COMMUNICATION_GENERATE: 10
      INTERVIEW_COACH: 60
      ATS_ANALYSIS: 20
    ats:
      prompt-version: "v1.0.1"
      schema-version: "v1.0.0"
    # T07 岗位定制生成
    generation:
      prompt-version: "v1.0.0"
      schema-version: "v1.0.0"
      max-selected-materials: 30
      max-output-bytes: 65536
      injection-detection:
        suspicious-patterns:
          - "(?i)ignore (?:all )?(?:previous|above|system) (?:rules|instructions)"
          - "(?i)you are now"
          - "(?i)system prompt"
          - "(?i)developer mode"
          - "(?i)\\bjailbreak\\b"
    # T08 来源确认与版本落地
    confirmation:
      require-explicit-source: true
      allow-user-new-fact: true
      max-confirmed-items: 200

  # T09 JD 规则覆盖度
  scoring:
    rule-version: "v1.0.0"
    weights:
      keyword: 0.4
      skill: 0.4
      experience: 0.2
    # 同义词词典：canonical → [同义词...]。
    # ⚠ 必须写成嵌套 map，并通过 @ConfigurationProperties（ScoringProperties）绑定。
    #   历史上这里用 @Value("#{${app.scoring.synonym-dictionary:{}}}") 注入 —— 该写法对嵌套 YAML
    #   无效（YAML 会被展平成 ...java[0] 索引键，不存在同名单键），占位符走默认值 {}，
    #   词典在运行时**静默为空**，导致含空格的多词关键词（如 "Spring Boot"）即使与简历
    #   逐字相同也判缺失、keywordCoverage 被系统性低估。**不要改回那种写法**。
    #   回归测试：ScoringDictionaryBindingIT / KeywordCoveragePhraseTest
    synonym-dictionary:
      java: ["java", "jdk", "openjdk"]
      spring: ["spring", "spring boot", "spring cloud"]
      mysql: ["mysql", "mariadb"]
      postgres: ["postgres", "postgresql"]
      redis: ["redis"]
      k8s: ["k8s", "kubernetes"]
      microservice: ["microservice", "微服务"]
    user-disclaimer: "本结果为 JD 规则覆盖度，非企业 ATS 结果、非录用概率"

  # T10 PDF
  pdf:
    worker:
      poll-interval-ms: ${PDF_WORKER_POLL_MS:1000}
      # 领取批次须满足：batch-size × 读超时 + 余量 ≤ 租约（批量在循环内串行处理，租约在领取时
      # 一次性写到 lease-seconds 之后）。此前默认 3 是「渲染足够快」的侥幸成立；第二十一批把
      # 读超时提升到服务端真实上界（50s）后，3 × 50s 会超过 90s 租约，故默认降为 1
      # （串行处理下吞吐不变，仅多一次领取查询）。关系由 PdfDeadlineContractTest 守护。
      batch-size: ${PDF_WORKER_BATCH:1}
      # 租约：单次投递（读超时 50s + 存储收尾）必须远小于它，否则租约在渲染中途被第二 worker
      # 接管 → 重复渲染（releaseSuccess 会丢弃 stale 结果，但外部渲染工作已浪费）
      lease-seconds: ${PDF_WORKER_LEASE_S:90}
    service-base-url: ${PDF_SERVICE_BASE_URL:http://127.0.0.1:3001}
    service-token: ${PDF_SERVICE_TOKEN:dev-pdf-token-change-me}
    # 读超时必须晚于 pdf-service 的服务端上界（排队上限 15s + setContent 15s + pdf 15s = 45s）：
    # 内层死线先触发，服务端的 503/失败路径才能正常到达客户端；此前 15s 会让「合法慢渲染
    # （16~45s，服务端自身预算内）」被客户端先断开——渲染被浪费、任务被误判失败。
    render-timeout-seconds: ${PDF_RENDER_TIMEOUT_S:50}
    max-input-bytes: ${PDF_MAX_INPUT_BYTES:524288}
    max-output-bytes: ${PDF_MAX_OUTPUT_BYTES:10485760}
    file-ttl-hours: ${PDF_FILE_TTL_HOURS:24}
    cleanup-interval-ms: ${PDF_CLEANUP_INTERVAL_MS:60000}
    cleanup-batch-size: ${PDF_CLEANUP_BATCH_SIZE:100}
    output-dir: ${PDF_OUTPUT_DIR:./pdf-output}
