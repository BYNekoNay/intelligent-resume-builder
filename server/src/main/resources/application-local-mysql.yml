# Local MySQL validation relies on Flyway migrations as the schema authority.
# Hibernate's validate mode is intentionally disabled here because MySQL 5.7
# reports TEXT/CLOB compatibility differently from Hibernate 6.
spring:
  jpa:
    hibernate:
      ddl-auto: none

app:
  ai:
    quota:
      JOB_GENERATION: 100000
      RESUME_OPTIMIZE: 100000
      INLINE_OPTIMIZE: 100000
      MATERIAL_IMPORT: 100000
      ACHIEVEMENT_GUIDANCE: 100000
      COMMUNICATION_GENERATE: 100000
  local-validation:
    failure-injection-enabled: true
  security:
    rate-limit:
      register-per-minute: 100
      login-per-minute: 100
      refresh-per-minute: 100
      # 本地联调会成批跑导出/体检/面试，避免误触 429（阈值仍低于测试profile，够验证重试语义）
      resume-import-parse-per-minute: 100
      jd-parse-per-minute: 100
      change-credential-per-minute: 100
      account-export-per-minute: 100
      pdf-render-per-minute: 100
      ai-generate-per-minute: 100
      ats-check-per-minute: 100
      interview-turn-per-minute: 100
      desktop-mutation-per-minute: 100
      health-detail-per-minute: 100
      write-default-per-minute: 1000
