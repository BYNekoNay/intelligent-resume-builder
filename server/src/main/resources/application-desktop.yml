# Windows 桌面本地工作区 profile（ADR-012 D1-D3）。
#
# 与在线版的差异只有四处：
#   1. 数据库换成 H2 **file** 模式（在线为 MySQL 8.4；MySQL 仍是 schema 权威，见 MySql84FreshMigrationIT）；
#   2. 数据落在本机数据目录，不落任何服务器；
#   3. 免登录 —— 启动时创建恒定的本地用户，由过滤器注入其 ID（不是「放行路径」，见 ADR-012 D3）；
#   4. 账号删除语义被禁用（在线版的删号会 7 天后级联硬删全部数据）。
#
# 启动示例：
#   java -jar intelligent-resume-server-0.4.0.jar --spring.profiles.active=desktop
# 数据目录可用 DESKTOP_DATA_DIR 覆盖（默认 ./desktop-data，相对工作目录）。
spring:
  datasource:
    url: jdbc:h2:file:${DESKTOP_DATA_DIR:./desktop-data}/resume;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,KEY,VALUE,ORDER,DATABASE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      # H2 与 Hibernate validate 与 columnDefinition="MEDIUMTEXT" 不兼容，沿用 local-h2 的既有选择
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        type:
          # H2 会把 setString 写进 JSON 列的内容存成「JSON 字符串标量」（双编码），
          # 默认 mapper 读回时抛 JsonJavaType。宽容 mapper 只对双编码文本多解一层，
          # 详见 LenientJsonFormatMapper 的类注释；生产（MySQL）profile 不使用它。
          json_format_mapper: com.intelligentresume.config.LenientJsonFormatMapper
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 桌面端从空库起步：基线到 V1，再顺序执行全部迁移
    baseline-on-migrate: true

server:
  port: 8082
  address: 127.0.0.1

app:
  desktop:
    enabled: true
    data-dir: ${DESKTOP_DATA_DIR:./desktop-data}
    # 本地用户的固定主键。必须与 user 表中该行一致，否则过滤器注入的 ID 查不到人。
    local-user-id: 1
  cors:
    # 同源部署（本地 Spring Boot 直接托管前端），不需要跨域；仅开发期 vite dev server 用。
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:5174
  jwt:
    # 桌面端单机单用户，密钥只需满足长度约束；不含任何真实凭据
    secret: desktop-local-only-secret-desktop-local-32bytes-min
    issuer: intelligent-resume-desktop
  security:
    rate-limit:
      # 本地单机不存在暴力破解面，放宽以免影响连续操作
      login-per-minute: 1000
      register-per-minute: 1000
      refresh-per-minute: 1000
  ai:
    worker:
      poll-interval-ms: 200
      lease-seconds: 180
      max-retries: 1
      batch-size: 1
      heavy-concurrency: 1
      light-concurrency: 1
  pdf:
    # 桌面端默认不连 pdf-service：PDF 由纯 Java 渲染器产出（ADR-012 D4）。
    # 保留 service-base-url 配置项以便临时回退到在线渲染链路做对照。
    service-base-url: http://127.0.0.1:3001
    service-token: desktop-pdf-token-change-me
    render-timeout-seconds: 30
    max-input-bytes: 65536
    max-output-bytes: 1048576
    file-ttl-hours: 24
    output-dir: ${DESKTOP_DATA_DIR:./desktop-data}/pdf-output
  retention:
    purge:
      # 桌面端没有服务端清扫；显式关闭以免误删本地工作区
      enabled: false
    account-purge:
      enabled: false
