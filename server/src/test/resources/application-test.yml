spring:
  datasource:
    url: jdbc:h2:mem:intelligent_resume_test;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,KEY,VALUE,ORDER,DATABASE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5176
  jwt:
    secret: test-only-secret-test-only-secret-32bytes-min-length-required
    issuer: intelligent-resume-builder-test
    access-token-ttl-seconds: 3600
    refresh-token-ttl-seconds: 86400
    refresh-cookie:
      name: irt_refresh
      max-age: 86400
      secure: false
  security:
    rate-limit:
      login-per-minute: 1000
      register-per-minute: 1000
      refresh-per-minute: 1000
      trust-forwarded-headers: false
      max-buckets: 100
  ai:
    provider: mock
    worker:
      poll-interval-ms: 60000
      lease-seconds: 60
      max-retries: 1
      batch-size: 1
    mock-provider:
      fail-rate: 0.0
      latency-ms: 0
  pdf:
    service-base-url: http://localhost:0
    service-token: test-token
    render-timeout-seconds: 5
    max-input-bytes: 65536
    max-output-bytes: 1048576
    file-ttl-hours: 1
    allowed-template-codes: classic,modern,minimal
    output-dir: ./build/test-pdf-output
  scoring:
    rule-version: v1.0.0
    weights:
      keyword: 0.4
      skill: 0.4
      experience: 0.2
    user-disclaimer: "本结果为 JD 规则覆盖度,非企业 ATS 结果、非录用概率"
