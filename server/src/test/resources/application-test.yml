spring:
  datasource:
    url: jdbc:h2:mem:intelligent_resume_test;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=USER,KEY,VALUE,ORDER,DATABASE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5176
  resume:
    json-schema:
      max-bytes: 262144
      require-top-level: basics
      allow-sections: basics,work,education,skills,projects,certificates,languages,awards,template
  career-material:
    content-json:
      max-bytes: 65536
  job:
    jd-text:
      max-length: 5000
      min-length: 20
    parser:
      rule-version: "v1.0.0"
      keyword-dictionary:
        - "Java"
        - "Spring Boot"
        - "Spring Cloud"
        - "MySQL"
        - "PostgreSQL"
        - "Redis"
        - "Kafka"
        - "Docker"
        - "Kubernetes"
        - "微服务"
        - "分布式"
        - "高并发"
        - "JVM"
        - "多线程"
      education-keywords:
        - "本科"
        - "硕士"
        - "博士"
        - "Bachelor"
        - "Master"
        - "PhD"
      experience-pattern: "(\\d+)\\s*年(以上)?(?:经验|工作)"
  jwt:
    secret: test-only-secret-test-only-secret-32bytes-min-length-required
    issuer: intelligent-resume-builder-test
    access-token-ttl-seconds: 3600
    refresh-token-ttl-seconds: 86400
    refresh-cookie:
      name: irt_refresh
      max-age: 86400
      secure: false
  security:
    rate-limit:
      login-per-minute: 1000
      register-per-minute: 1000
      refresh-per-minute: 1000
      trust-forwarded-headers: false
      max-buckets: 100
  ai:
    bailian:
      api-key: ""
    worker:
      poll-interval-ms: 60000
      lease-seconds: 60
      max-retries: 1
      batch-size: 1
    consent:
      policy-version: "v1.1.0"
    quota:
      JOB_GENERATION: 30
      RESUME_OPTIMIZE: 30
      INLINE_OPTIMIZE: 60
      MATERIAL_IMPORT: 5
      ACHIEVEMENT_GUIDANCE: 10
      COMMUNICATION_GENERATE: 10
    generation:
      prompt-version: "v1.0.0"
      schema-version: "v1.0.0"
      max-selected-materials: 30
      max-output-bytes: 65536
      injection-detection:
        suspicious-patterns:
          - "(?i)ignore (?:all )?(?:previous|above|system) (?:rules|instructions)"
          - "(?i)you are now"
          - "(?i)system prompt"
          - "(?i)developer mode"
          - "(?i)\\bjailbreak\\b"
    confirmation:
      require-explicit-source: true
      allow-user-new-fact: true
      max-confirmed-items: 200
  scoring:
    rule-version: "v1.0.0"
    weights:
      keyword: 0.4
      skill: 0.4
      experience: 0.2
    synonym-dictionary:
      java: ["java", "jdk", "openjdk"]
      spring: ["spring", "spring boot", "spring cloud"]
      mysql: ["mysql", "mariadb"]
      postgres: ["postgres", "postgresql"]
      redis: ["redis"]
      k8s: ["k8s", "kubernetes"]
      microservice: ["microservice", "微服务"]
    user-disclaimer: "本结果为 JD 规则覆盖度，非企业 ATS 结果、非录用概率"
  pdf:
    worker:
      poll-interval-ms: 60000
      batch-size: 1
      lease-seconds: 90
    service-base-url: http://localhost:0
    service-token: test-token
    render-timeout-seconds: 5
    max-input-bytes: 65536
    max-output-bytes: 1048576
    file-ttl-hours: 1
    allowed-template-codes: classic,modern,minimal
    output-dir: ./build/test-pdf-output
