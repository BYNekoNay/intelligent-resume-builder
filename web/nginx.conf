server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ⚠ 内层代理必须显式声明体积上限：nginx 内置默认仅 1m，而本层位于 edge 之后、
    # API 之前，是「edge 已放行、却被这里拒绝」的静默收紧点（1~5MB 的简历会拿到
    # 本层的 413 + nginx 自带 HTML，而非统一信封）。取 5m 与 edge 及 API 的
    # spring.servlet.multipart.max-file-size(5MB) 对齐。契约由 UploadPathContractTest 守护。
    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 内层代理：upstream（edge）已用 $remote_addr 覆写并终止伪造链，这里必须继续**追加**
        # （$proxy_add_x_forwarded_for），保证应用看到的最左值仍是真实客户端；
        # 改成覆写会把限流分桶退化为 edge 容器地址（全站共享）。契约由 DeployProxyClientIpContractTest 守护。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
