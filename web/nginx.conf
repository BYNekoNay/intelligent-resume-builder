server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ⚠ 内层代理必须显式声明体积上限：nginx 内置默认仅 1m，而本层位于 edge 之后、
    # API 之前，是「edge 已放行、却被这里拒绝」的静默收紧点（1~5MB 的简历会拿到
    # 本层的 413 + nginx 自带 HTML，而非统一信封）。
    # 取值 6m = 应用的「整请求」上限（spring.servlet.multipart.max-request-size），
    # **不是**单文件上限 5MB：本指令限制的是整个请求体（含 multipart 边界与头），
    # 若按 5m 对齐，恰好 5MB 的文件会因这几百字节开销在此被 413 拒绝，使接口文档
    # 承诺的 5MB 边界不可达（应用自身的 max-file-size=5MB 才是文件级判据，超限返回
    # 统一信封）。契约由 UploadPathContractTest 守护。
    client_max_body_size 6m;

    # 静态文本产物压缩：构建产物 64 个 js/css/svg 合计 1001KB → gzip 285KB（3.5×），
    # 首屏入口 5 个文件 457KB → 140KB。nginx 默认只压 text/html，故必须显式列出 js/css。
    # 接口响应已由应用层压缩（server.compression），且 gzip_proxied 默认 off，
    # 本层不会对反代响应做二次压缩。契约由 StaticAssetDeliveryContractTest 守护。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript text/javascript application/json application/xml image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 内层代理：upstream（edge）已用 $remote_addr 覆写并终止伪造链，这里必须继续**追加**
        # （$proxy_add_x_forwarded_for），保证应用看到的最左值仍是真实客户端；
        # 改成覆写会把限流分桶退化为 edge 容器地址（全站共享）。契约由 DeployProxyClientIpContractTest 守护。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 带内容哈希的构建产物可长期缓存（index.html 本身不含哈希，仍走上方 no-cache，
    # 保证发版后立刻引用新的哈希文件名）。宿主版 host.conf 早有该块，容器版此前缺失，
    # 导致 60+ 个资源每次导航都要回源校验。契约由 StaticAssetDeliveryContractTest 守护。
    # 注：镜像内不含 security-headers.conf 片段（构建上下文为 web/），故此处不 include；
    # 安全响应头由最外层 edge 统一下发（见 deploy/nginx/web.conf 的同名块）。
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
