name: Publish ACR Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable release tag
        required: true
        default: release-20260726-1
        type: string

permissions:
  contents: read

concurrency:
  group: publish-acr-images
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish runtime images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      IMAGE_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build and push final images
        run: bash scripts/Build-And-PushRegistryImages.sh
