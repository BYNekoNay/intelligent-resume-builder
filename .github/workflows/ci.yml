name: CI

on:
  push:
    # branches-ignore 而不是 branches：新分支不再需要改 YAML 才有 CI。
    # 第七十五批时曾在 codex/web-business-flow 上白跑了两轮"实际没触发"的认知——
    # branches 白名单只列 master 与 codex/resume-loop-enhancements，新分支被静默漏掉。
    # 也不用 "branches: ['**'] + paths 过滤"：被过滤未触发时，必需检查会停在 Pending
    # 而非 Skipped，只改文档的 PR 会永远等不到 server 结论而无法合并。
    branches-ignore:
      - gh-pages
      - "dependabot/**"
      - "renovate/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Run unit and integration tests
        run: mvn --batch-mode --no-transfer-progress test
      - name: Validate production Compose manifests
        working-directory: deploy
        run: docker compose --env-file production.env.example -f docker-compose.prod.yml config --quiet

  migration-84:
    name: MySQL 8.4 fresh migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 生产口径是 MySQL 8.4（deploy/docker-compose.prod.yml），而此前 CI 里唯一的 MySQL 是
    # functional.yml 的 8.0，迁移测试则全靠 @EnabledIfEnvironmentVariable 门控 ——
    # 环境变量没人设，整类被 JUnit 跳过，而 mvn 退出码仍是 0。这个 job 补上那段空白：
    # 起一个 8.4、按被测类的断言建对库名与排序规则，并用 scripts/assert-tests-ran.py
    # 明确拒绝「跳过 = 通过」。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        # ⚠ services.options 是传给 `docker create` 的 **docker 参数**，不是 mysqld 参数。
        # 首版把 --character-set-server/--collation-server 写在这里，CI 直接报
        # `unknown flag: --character-set-server`，容器根本没被创建（已实测）。
        # 排序规则改由后面那步用 docker exec 在库里显式指定。
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml
      # 库名与排序规则都是被测类的断言对象（DATABASE() 前缀 + @@collation_database）。
      # 不用 MYSQL_DATABASE 让镜像建库：8.4 默认排序规则是 utf8mb4_0900_ai_ci，
      # 而测试断言 utf8mb4_unicode_ci —— 由镜像建库会直接红，所以显式建。
      - name: Create gate schema with the collation the test asserts
        run: |
          container_id="$(docker ps --filter "name=mysql" --format '{{.ID}}' | head -1)"
          test -n "$container_id" || { echo "找不到 mysql service 容器" >&2; exit 1; }
          docker exec "$container_id" mysql -uroot -proot -e "
            CREATE DATABASE IF NOT EXISTS intelligent_resume_gate84_ci
              CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          docker exec "$container_id" mysql -uroot -proot -N -B -e "
            SELECT @@collation_database FROM DUAL;" intelligent_resume_gate84_ci

      - name: Run MySQL 8.4 fresh-install migration gate
        env:
          MYSQL84_LIVE_TEST: 'true'
          MYSQL84_JDBC_URL: jdbc:mysql://127.0.0.1:3306/intelligent_resume_gate84_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
          MYSQL84_USER: root
          MYSQL84_PASSWORD: root
        run: |
          # 先删旧报告：否则类没跑成功时，下一步会读到上一次的陈旧 XML 而假绿
          rm -rf target/surefire-reports
          mvn --batch-mode --no-transfer-progress -Dtest=MySql84FreshMigrationIT test
      - name: Assert the migration test really ran (skip is not a pass)
        if: always()
        working-directory: .
        run: |
          # 容器初始化失败时 GH 会跳过 checkout，本步（if: always）会在空目录里跑 ——
          # 明确报出来，而不是抛一个 python 的 "No such file"
          if [ ! -f scripts/assert-tests-ran.py ]; then
            echo "checkout 未执行（前序步骤在构建/容器初始化阶段就失败了）—— 门禁无法复核，判失败" >&2
            exit 1
          fi
          python3 scripts/assert-tests-ran.py \
            server/target/surefire-reports/TEST-com.intelligentresume.database.MySql84FreshMigrationIT.xml \
            "MySQL 8.4 fresh migration"

  web:
    name: Web build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      # 单测放在 Chromium 安装之前：失败时不必先等浏览器下载完
      - name: Run unit tests
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build web application
        run: npm run build
      - name: Run browser tests
        run: npm run test:e2e

  pdf-service:
    name: PDF service checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pdf-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pdf-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check service syntax
        run: npm run check
      - name: Run service tests
        run: npm test
