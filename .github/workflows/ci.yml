name: CI

on:
  push:
    # branches-ignore 而不是 branches：新分支不再需要改 YAML 才有 CI。
    # 第七十五批时曾在 codex/web-business-flow 上白跑了两轮"实际没触发"的认知——
    # branches 白名单只列 master 与 codex/resume-loop-enhancements，新分支被静默漏掉。
    # 也不用 "branches: ['**'] + paths 过滤"：被过滤未触发时，必需检查会停在 Pending
    # 而非 Skipped，只改文档的 PR 会永远等不到 server 结论而无法合并。
    branches-ignore:
      - gh-pages
      - "dependabot/**"
      - "renovate/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Run unit and integration tests
        run: mvn --batch-mode --no-transfer-progress test
      - name: Validate production Compose manifests
        working-directory: deploy
        run: docker compose --env-file production.env.example -f docker-compose.prod.yml config --quiet

  migration-84:
    name: MySQL 8.4 fresh migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 生产口径是 MySQL 8.4（deploy/docker-compose.prod.yml），而此前 CI 里唯一的 MySQL 是
    # functional.yml 的 8.0，迁移测试则全靠 @EnabledIfEnvironmentVariable 门控 ——
    # 环境变量没人设，整类被 JUnit 跳过，而 mvn 退出码仍是 0。这个 job 补上那段空白：
    # 起一个 8.4、按被测类的断言建对库名与排序规则，并用 scripts/assert-tests-ran.py
    # 明确拒绝「跳过 = 通过」。
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          # 库名与排序规则都是被测类的断言对象（DATABASE() 前缀 + @@collation_database）。
          # 由镜像 init 创建时会继承下面的 --collation-server，所以能对上 utf8mb4_unicode_ci。
          MYSQL_DATABASE: intelligent_resume_gate84_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --character-set-server=utf8mb4
          --collation-server=utf8mb4_unicode_ci
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Run MySQL 8.4 fresh-install migration gate
        env:
          MYSQL84_LIVE_TEST: 'true'
          MYSQL84_JDBC_URL: jdbc:mysql://127.0.0.1:3306/intelligent_resume_gate84_ci?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
          MYSQL84_USER: root
          MYSQL84_PASSWORD: root
        run: |
          # 先删旧报告：否则类没跑成功时，下一步会读到上一次的陈旧 XML 而假绿
          rm -rf target/surefire-reports
          mvn --batch-mode --no-transfer-progress -Dtest=MySql84FreshMigrationIT test
      - name: Assert the migration test really ran (skip is not a pass)
        if: always()
        working-directory: .
        run: |
          python3 scripts/assert-tests-ran.py \
            server/target/surefire-reports/TEST-com.intelligentresume.database.MySql84FreshMigrationIT.xml \
            "MySQL 8.4 fresh migration"

  web:
    name: Web build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      # 单测放在 Chromium 安装之前：失败时不必先等浏览器下载完
      - name: Run unit tests
        run: npm run test:unit
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build web application
        run: npm run build
      - name: Run browser tests
        run: npm run test:e2e

  pdf-service:
    name: PDF service checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pdf-service
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pdf-service/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check service syntax
        run: npm run check
      - name: Run service tests
        run: npm test
