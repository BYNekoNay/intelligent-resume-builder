name: publish-registry-images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Immutable image tag, usually the release version or commit SHA
        required: true
        type: string

jobs:
  publish:
    name: Build and publish runtime images
    runs-on: ubuntu-latest
    environment: production
    env:
      ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ secrets.ACR_NAMESPACE }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      IMAGE_PLATFORM: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and push final images
        run: bash scripts/Build-And-PushRegistryImages.sh
