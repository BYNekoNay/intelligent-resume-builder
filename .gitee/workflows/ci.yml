name: quality-gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    name: Backend tests and Flyway validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run backend tests
        working-directory: server
        run: mvn -B -q test

  frontend:
    name: Frontend build and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build frontend
        working-directory: web
        run: npm run build
      - name: Install Chromium only for CI
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Run browser regression tests
        working-directory: web
        run: npm run test:e2e

  pdf-and-deployment:
    name: PDF checks and deployment manifest validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: pdf-service/package-lock.json
      - name: Install PDF service dependencies
        working-directory: pdf-service
        run: npm ci
      - name: Run PDF service checks
        working-directory: pdf-service
        run: |
          npm run check
          npm test
      - name: Validate production Compose without starting containers
        working-directory: deploy
        run: docker compose --env-file production.env.example -f docker-compose.prod.yml config --quiet
      - name: Reject whitespace errors
        run: git diff --check HEAD^ HEAD
