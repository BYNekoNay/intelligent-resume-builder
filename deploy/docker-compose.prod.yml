name: intelligent-resume

# 容器日志上限：docker 默认 json-file 驱动**不轮转**，日志会无上限累积在
# /var/lib/docker/containers/*/*-json.log（systemd 路径已显式用 journald 轮转，两条交付路径
# 的边界应一致）。10m × 5 = 每容器最多 50MB。契约由 ComposeResourceBoundsContractTest 守护。
x-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  edge:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # 资源上限：宿主内存偏紧（文档记载 3.6GiB 总量），内存取值沿用同宿主 ip-test 拓扑的实测值；
    # 日志上限见顶部 x-logging。契约由 ComposeResourceBoundsContractTest 守护。
    mem_limit: 128m
    logging: *service-logging
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST is required}
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_started
    networks: [public, private]

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 128m
    logging: *service-logging
    depends_on:
      api:
        condition: service_healthy
    networks: [private]

  api:
    build:
      context: ../server
      dockerfile: Dockerfile
    restart: unless-stopped
    # 优雅停机：Spring 在收到 SIGTERM 后等待在途 HTTP 请求（上限
    # spring.lifecycle.timeout-per-shutdown-phase，默认 20s）；docker 默认 10s 宽限期
    # 会中途 SIGKILL，因此必须大于该上限。契约由 ShutdownContractTest 门禁守护。
    stop_grace_period: 25s
    # 内存上限 = 堆上限 768m + 元空间 224m + 线程/直接内存余量；堆上限与 systemd 路径**一致**
    # （未指定 -Xmx 时 JVM 默认取可用内存的 25%：本机实测 15.71GiB → MaxHeapSize 4219469824 字节，
    # 3.6GiB 宿主上等价 ≈922MB，高于该宿主刻意压到的 768m）。契约由 ComposeResourceBoundsContractTest 守护。
    mem_limit: 1200m
    logging: *service-logging
    env_file: ${DEPLOY_ENV_FILE:-production.env}
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m -XX:MaxMetaspaceSize=224m
    volumes:
      - pdf-output:/var/lib/intelligent-resume/pdf-output
    depends_on:
      mysql:
        condition: service_healthy
      pdf-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [private]

  pdf-service:
    build:
      context: ../pdf-service
      dockerfile: Dockerfile
    restart: unless-stopped
    # 收到 SIGTERM 后拒绝新渲染、等待 in-flight 结束（PDF_SERVICE_DRAIN_TIMEOUT_MS 默认 10s）；
    # 宽限期必须大于该值，否则 docker 会在渲染中途 SIGKILL
    stop_grace_period: 30s
    # Chromium 渲染进程内存占用高，必须设上限（同宿主 ip-test 拓扑取同一值）
    mem_limit: 768m
    logging: *service-logging
    env_file: ${DEPLOY_ENV_FILE:-production.env}
    environment:
      NODE_ENV: production
      PDF_SERVICE_PORT: 3001
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [private]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    mem_limit: 700m
    logging: *service-logging
    env_file: ${DEPLOY_ENV_FILE:-production.env}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [private]

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 512m
    logging: *service-logging
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    networks: [private]

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 384m
    logging: *service-logging
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SERVER_ROOT_URL: https://${PUBLIC_HOST:?PUBLIC_HOST is required}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [private]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 128m
    logging: *service-logging
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TO: ${SMTP_TO:-}
    volumes:
      - ../monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.template.yml:ro
      - ../monitoring/alertmanager/entrypoint.sh:/entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    depends_on:
      api:
        condition: service_healthy
    ports:
      # 仅绑定本机回环，避免把告警控制台暴露到公网（与 Grafana 一致走 Edge 反代/SSH 隧道）。
      - "127.0.0.1:9093:9093"
    networks: [private]

networks:
  public:
  private:
    internal: true

volumes:
  mysql-data:
  pdf-output:
  prometheus-data:
  grafana-data:
  alertmanager-data:
