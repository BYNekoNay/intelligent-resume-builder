server {
    listen 80;
    server_name ${PUBLIC_HOST};
    client_max_body_size 5m;

    # 安全响应头（server 级；本文件无自有 add_header 的 location，无需块级冗余 include）
    include snippets/security-headers.conf;

    location / {
        proxy_pass http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ⚠ 最外层代理必须**覆写**（而非 $proxy_add_x_forwarded_for 追加）X-Forwarded-For：
        # 应用在 RATE_LIMIT_TRUST_FORWARDED_HEADERS=true 下取最左值做限流分桶，只追加会让
        # 客户端伪造的最左值生效（绕过按 IP 限流，并把分桶表顶到 maxBuckets 触发 fail-closed 误伤）。
        # 内层 web 代理继续追加，真实客户端仍在最左；契约由 DeployProxyClientIpContractTest 守护。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
