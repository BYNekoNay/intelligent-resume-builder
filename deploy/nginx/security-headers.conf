# ============================================================================
# 智历 · 安全响应头片段（security-headers.conf）
#
# 用途：为所有响应补齐基础安全响应头。由 host.conf（生产直连版）、
#       web.conf（容器版）、edge-ip-test.conf.template（TLS 测试入口）
#       在 server 级与 location 级分别 include。
#
# ⚠ nginx 继承陷阱：add_header 不跨层级累加——location 内一旦出现任何
#   自有 add_header（例如 Cache-Control），server 级的全部 add_header 对该
#   location 整体失效。因此凡自有 add_header 的 location，必须在该
#   location 内再次 include 本片段，才能保证下方 4 条头全部下发；
#   同一 location 内 include 进来的 4 条与自有 add_header 同层级共存，均生效。
#
# 安装位置：/etc/nginx/snippets/security-headers.conf
#           （各配置统一使用相对 prefix 的写法 include snippets/security-headers.conf;）
#
# CSP 采用 Report-Only 灰度：浏览器只上报违规、不实际阻断，零误杀风险；
# 观察无违规上报后，再切换为强制模式 Content-Security-Policy。
# ============================================================================

# 禁止浏览器对 Content-Type 做 MIME 嗅探，防类型混淆型 XSS
add_header X-Content-Type-Options "nosniff" always;

# 禁止被任何页面 iframe 嵌套，防点击劫持（与 CSP frame-ancestors 'none' 叠加）
add_header X-Frame-Options "DENY" always;

# 控制跳转/外链时的 Referer 泄露：同源保留完整路径，跨源仅发 origin
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# CSP 灰度（Report-Only）：img 放行 Unsplash（index.html 配图）与 data:；
# style-src 'unsafe-inline' 兜 Vue 运行时注入的内联 style
add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' https://images.unsplash.com data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
