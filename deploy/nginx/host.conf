# 智历 · 宿主机直连部署版 nginx 配置（非 Docker）
#
# 与 deploy/nginx/web.conf（容器版，反代到 Docker 服务名 api:8080）并存，互不影响。
# 安装位置：/etc/nginx/sites-available/intelligent-resume
# 启用：ln -sf /etc/nginx/sites-available/intelligent-resume /etc/nginx/sites-enabled/
#       rm -f /etc/nginx/sites-enabled/default && nginx -t && systemctl reload nginx
# 安全头片段：mkdir -p /etc/nginx/snippets && cp deploy/nginx/security-headers.conf
#             /etc/nginx/snippets/  ← 必须先于 nginx -t 完成，否则 include 失败导致 reload 被拒
#
# 安全响应头：统一由 snippets/security-headers.conf 片段下发（4 条头）。
# ⚠ 继承陷阱：location 内一旦有自己的 add_header（如下方 / 与静态资源块的
#   Cache-Control），server 级 add_header 对该 location 全部失效，因此
#   server 级与每个 location 内都必须各 include 一次该片段。

server {
    # ⚠ 刻意监听 8088 而不是 80：
    # 当前宿主机（101.35.239.218）的 80/443 已被同机另一个项目
    # （educational-administration，Docker + Caddy）占用。若此处监听 80，
    # nginx 会因 EADDRINUSE 直接启动失败，并把对方站点一起搞坏。
    # 公网入口为 http://101.35.239.218:8088/ （需安全组放行 TCP 8088）。
    # 也不加 default_server：该连接不是本机默认的 IP:80 入口。
    listen 8088;
    server_name _;

    # 前端静态产物目录（由部署脚本同步自 src/web/dist）
    root /opt/intelligent-resume/app/web;
    index index.html;

    # 与后端「整请求」上限 spring.servlet.multipart.max-request-size（6MB）对齐：
    # 本指令限制的是整个请求体（含 multipart 边界与头），按单文件上限 5MB 对齐会让
    # 恰好 5MB 的文件在此被 413 拦截（应用自身的 max-file-size=5MB 才是文件级判据）。
    client_max_body_size 6m;

    # 安全响应头（server 级，覆盖无自有 add_header 的请求）
    include snippets/security-headers.conf;

    # API 反代到本机回环，8080 不对公网暴露
    location /api/ {
        include snippets/security-headers.conf; # location 级冗余 include，防未来在块内新增 add_header 后 server 级头失效
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # ⚠ 本机 nginx 是唯一入口（最外层代理），必须**覆写** X-Forwarded-For 为 $remote_addr：
        # 应用开启 RATE_LIMIT_TRUST_FORWARDED_HEADERS 后取 XFF 最左值做限流分桶，只追加会让
        # 客户端伪造的最左值生效（绕过按 IP 限流）。契约由 DeployProxyClientIpContractTest 守护。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;

        # 与 BAILIAN_READ_TIMEOUT_S(300s) 对齐：AI 推理模型生成一轮简历约 40-120s，
        # 若 nginx 先于后端超时会让前端收到 504 而误判失败。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        include snippets/security-headers.conf; # 本块有自有 add_header，必须块内再 include 一次
        add_header Cache-Control "no-cache";
    }

    # 带内容哈希的构建产物可长期缓存
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        include snippets/security-headers.conf; # 本块有自有 add_header，必须块内再 include 一次
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
