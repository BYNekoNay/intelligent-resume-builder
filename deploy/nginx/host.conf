# 智历 · 宿主机直连部署版 nginx 配置（非 Docker）
#
# 与 deploy/nginx/web.conf（容器版，反代到 Docker 服务名 api:8080）并存，互不影响。
# 安装位置：/etc/nginx/sites-available/intelligent-resume
# 启用：ln -sf /etc/nginx/sites-available/intelligent-resume /etc/nginx/sites-enabled/
#       rm -f /etc/nginx/sites-enabled/default && nginx -t && systemctl reload nginx

server {
    # ⚠ 刻意监听 8088 而不是 80：
    # 当前宿主机（101.35.239.218）的 80/443 已被同机另一个项目
    # （educational-administration，Docker + Caddy）占用。若此处监听 80，
    # nginx 会因 EADDRINUSE 直接启动失败，并把对方站点一起搞坏。
    # 公网入口为 http://101.35.239.218:8088/ （需安全组放行 TCP 8088）。
    # 也不加 default_server：该连接不是本机默认的 IP:80 入口。
    listen 8088;
    server_name _;

    # 前端静态产物目录（由部署脚本同步自 src/web/dist）
    root /opt/intelligent-resume/app/web;
    index index.html;

    # 与后端 spring.servlet.multipart.max-file-size / max-request-size 对齐，
    # 避免简历导入在 nginx 层被 413 拦截。
    client_max_body_size 5m;

    # API 反代到本机回环，8080 不对公网暴露
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;

        # 与 BAILIAN_READ_TIMEOUT_S(300s) 对齐：AI 推理模型生成一轮简历约 40-120s，
        # 若 nginx 先于后端超时会让前端收到 504 而误判失败。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 带内容哈希的构建产物可长期缓存
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
