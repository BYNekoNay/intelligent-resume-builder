# 智历 · 容器版 nginx 配置（前端静态容器内 8080，API 反代到 Docker 服务名 api:8080）
#
# 与 deploy/nginx/host.conf（宿主机直连版）并存，互不影响。
# 注意：容器镜像实际打包的是 web/nginx.conf（web/Dockerfile COPY 进镜像），
#       本文件为部署侧同步副本，两份内容需保持一致。
#
# 安全响应头：统一由 snippets/security-headers.conf 片段下发（4 条头）。
# ⚠ 继承陷阱：location 内一旦有自己的 add_header（如下方 / 块的
#   Cache-Control），server 级 add_header 对该 location 全部失效，因此
#   server 级与每个 location 内都必须各 include 一次该片段。
# 容器内需将片段文件放置于 /etc/nginx/snippets/security-headers.conf。

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ⚠ 内层代理必须显式声明体积上限：nginx 内置默认仅 1m，而本层位于 edge 之后、
    # API 之前，是「edge 已放行、却被这里拒绝」的静默收紧点（1~5MB 的简历会拿到
    # 本层的 413 + nginx 自带 HTML，而非统一信封）。取 5m 与 edge 及 API 的
    # spring.servlet.multipart.max-file-size(5MB) 对齐。契约由 UploadPathContractTest 守护。
    client_max_body_size 5m;

    # 安全响应头（server 级，覆盖无自有 add_header 的请求）
    include snippets/security-headers.conf;

    location /api/ {
        include snippets/security-headers.conf; # location 级冗余 include，防未来在块内新增 add_header 后 server 级头失效
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 内层代理：upstream（edge）已用 $remote_addr 覆写并终止伪造链，这里必须继续**追加**
        # （$proxy_add_x_forwarded_for），保证应用看到的最左值仍是真实客户端；
        # 改成覆写会把限流分桶退化为 edge 容器地址（全站共享）。契约由 DeployProxyClientIpContractTest 守护。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-Id $request_id;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include snippets/security-headers.conf; # 本块有自有 add_header，必须块内再 include 一次
        add_header Cache-Control "no-cache";
    }
}
