# 智历 · Prometheus 抓取配置（直连部署，非 Docker）
#
# 为什么不用仓库里 monitoring/prometheus 的那份：那份是给 compose 写的，
# targets 是容器服务名 `api:8080` —— 直连部署下这个名字根本解析不到，
# 于是监控"纸面就绪、实际从未接入"。这里改成回环地址，与 systemd 单元同源。
#
# 只抓一个目标、只留 7 天：宿主机 3.6G 且与其他项目共用，不做长期存储。
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  external_labels:
    env: test-direct
    app: intelligent-resume

scrape_configs:
  - job_name: intelligent-resume-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['127.0.0.1:8080']
        labels:
          component: api

  # Prometheus 自身：用于观察是否出现抓取积压/内存异常
  - job_name: prometheus-self
    static_configs:
      - targets: ['127.0.0.1:9090']
