services:
  mysql:
    image: mysql:8.4
    container_name: intelligent-resume-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-intelligent_resume}
      MYSQL_USER: ${MYSQL_USER:-resume_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-resume_app_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_only}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root_dev_only}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
