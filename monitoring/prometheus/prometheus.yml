global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

# 告警推送目标：Alertmanager（同一 private 网络，仅 monitoring profile 启用）。
alerting:
  alertmanagers:
    - api_version: v2
      timeout: 10s
      static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: intelligent-resume-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api:8080]
